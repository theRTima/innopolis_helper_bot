name: innopolis-helper-bot
x-app: &app
  build: .
  image: innopolis-helper-bot:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bot
    KNOWLEDGE_DIR: /app/data/knowledge
    LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-${LLM_BASE_URL:-http://host.docker.internal:8081/v1}}
    VISION_BASE_URL: ${DOCKER_LLM_BASE_URL:-${LLM_BASE_URL:-http://host.docker.internal:8081/v1}}
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
      <<: *app
      restart: unless-stopped
      command: ["python", "-m", "app"]
      depends_on:
        postgres:
          condition: service_healthy
      volumes:
        - ./data/knowledge:/app/data/knowledge:ro

  viewer:
    <<: *app
    restart: unless-stopped
    command: ["uvicorn", "app.anchors.viewer:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      # Loopback only: put an HTTPS reverse proxy in front for real users.
      - "127.0.0.1:${VIEWER_PORT:-8090}:8090"
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8090), 2)"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana:/etc/grafana/provisioning:ro

  # Offline chunk preparation: writes *.chunks.jsonl next to the PDFs.
  ingest:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: innopolis-helper-bot-ingest:local
    profiles: ["ingest"]
    restart: "no"
    # Files are written into the bind mount with the host user's ids.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["python", "scripts/ingest.py"]
    command: ["--parser", "light"]
    volumes:
      - ./data/knowledge:/app/data/knowledge

  # Optional containerised llama.cpp server. Put GGUF files into ./.models and
  # set DOCKER_LLM_BASE_URL=http://llama:8080/v1 in .env.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server   # use :server-cuda for NVIDIA GPUs
    profiles: ["llm"]
    restart: unless-stopped
    command:
      - "-m"
      - "/models/${LLAMA_MODEL_FILE:-model.gguf}"
      - "--mmproj"
      - "/models/${LLAMA_MMPROJ_FILE:-mmproj.gguf}"
      - "--alias"
      - "${LLM_MODEL:-gemma-4-e2b}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLAMA_CTX:-8192}"
    volumes:
      - ./.models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
  grafana_data:
