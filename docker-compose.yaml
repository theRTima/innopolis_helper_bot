name: innopolis-helper-bot

x-app: &app
  build: .
  image: innopolis-helper-bot:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bot
    KNOWLEDGE_DIR: /app/data/knowledge
    DOCUMENTS_DIR: /app/data/processed/documents
  extra_hosts:
    # Allows a host-run OpenAI-compatible server to be reached from containers.
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5438}:5432"
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      - ./data/processed:/app/data/processed:ro

  viewer:
    <<: *app
    restart: unless-stopped
    command:
      - "uvicorn"
      - "app.anchors.viewer:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8090"
    ports:
      # Loopback only; expose through an HTTPS reverse proxy for real users.
      - "127.0.0.1:${VIEWER_PORT:-8090}:8090"
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      - ./data/processed:/app/data/processed:ro
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1', 8090), 2)"
      interval: 15s
      timeout: 5s
      retries: 3

  analytics:
    <<: *app
    profiles: ["analytics"]
    restart: unless-stopped
    command:
      - "uvicorn"
      - "app.analytics.web:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8002"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-8002}:8002"

  analytics-labeler:
    <<: *app
    profiles: ["analytics"]
    restart: unless-stopped
    command: ["python", "-m", "app.analytics", "--watch", "30"]
    depends_on:
      postgres:
        condition: service_healthy

  ticket-worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "app.tickets.worker", "--watch", "30"]
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: innopolis-helper-bot-admin:local
    restart: unless-stopped
    env_file:
      - path: ./storage/admin.env
        required: false
    environment:
      ADMIN_DATABASE_HOST: postgres
      ADMIN_DATABASE_PORT: "5432"
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      DOCUMENT_INBOX_DIR: /app/data/inbox
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8001}:8001"
    volumes:
      - ./data/inbox:/app/data/inbox
    depends_on:
      postgres:
        condition: service_healthy
      document-worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana:/etc/grafana/provisioning:ro

  # One-shot versioned pipeline for every PDF currently in data/knowledge.
  # Add files to ./data/knowledge and rerun; no .env changes are required.
  ingest:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: innopolis-helper-bot-ingest:local
    profiles: ["ingest"]
    restart: "no"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["python", "scripts/docker_ingest_all.py"]
    command:
      - "--knowledge-dir"
      - "/app/data/knowledge"
      - "--storage-root"
      - "/app/data/processed/documents"
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      - ./data/processed:/app/data/processed

  # Persistent worker used by the admin upload page. It shares the inbox and
  # versioned store with the admin and bot, but keeps parsing off web requests.
  document-worker:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.ingest
    image: innopolis-helper-bot-ingest:local
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["python", "scripts/document_worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bot
      DOCUMENTS_DIR: /app/data/processed/documents
      DOCUMENT_INBOX_DIR: /app/data/inbox
      KNOWLEDGE_DIR: /app/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/inbox:/app/data/inbox
      - ./data/processed:/app/data/processed

  # Optional containerised llama.cpp server. Put GGUF files into ./.models and
  # set LLM_BASE_URL=http://llama:8080/v1 in .env.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    restart: unless-stopped
    command:
      - "-m"
      - "/models/${LLAMA_MODEL_FILE:-model.gguf}"
      - "--mmproj"
      - "/models/${LLAMA_MMPROJ_FILE:-mmproj.gguf}"
      - "--alias"
      - "${LLM_MODEL:-gemma-4-e2b}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLAMA_CTX:-8192}"
    volumes:
      - ./.models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
  grafana_data:
