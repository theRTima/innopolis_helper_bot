[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "innopolis-helper-bot"
version = "0.2.0"
description = "Document ingestion for the corporate support RAG pipeline"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1,<2",
    "Pillow>=11,<14",
]

[project.scripts]
rag-ingest = "rag_pipeline.ingest:main"

[tool.setuptools.packages.find]
include = ["rag_pipeline*"]
