[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "innopolis-helper-bot"
version = "0.3.0"
description = "Telegram bot and versioned document ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1,<2",
    "Pillow>=11,<14",
    "pypdfium2>=5,<6",
    "aiogram>=3.15,<4",
    "fastapi>=0.115,<1",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "snowballstemmer>=2.2",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
rag-ingest = "app.rag.ingest:main"
rag-render = "app.rag.render:main"
rag-extract = "app.rag.extract:main"

[project.optional-dependencies]
ingestion = [
    "docling",
    "Jinja2",
    "PyMuPDF",
]
dev = ["flake8>=7,<8", "black>=26,<27"]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.rag.extraction" = ["prompts/*"]
